<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Hunt Pro — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #08080a;
    color: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    letter-spacing: -0.01em;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(99,102,241,.22), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(168,85,247,.16), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(236,72,153,.06), transparent 60%);
    z-index: 0;
    animation: drift 20s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate(0,0); }
    to { transform: translate(20px,-20px); }
  }
  /* Subtle grid overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: linear-gradient(180deg, rgba(24,24,27,.85), rgba(15,15,17,.92));
    border: 1px solid rgba(63,63,70,.5);
    border-radius: 22px;
    padding: 40px 36px;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow:
      0 40px 100px rgba(0,0,0,.6),
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 -10px 40px rgba(99,102,241,.05) inset;
    position: relative;
    z-index: 1;
  }
  .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 6px 18px rgba(99,102,241,.4);
  }
  .brand {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.025em;
  }
  .sub { font-size: 13px; color: #a1a1aa; margin-bottom: 28px; line-height: 1.5; }
  .tabs {
    display: flex; gap: 4px; padding: 4px;
    background: rgba(9,9,11,.7);
    border: 1px solid rgba(63,63,70,.4);
    border-radius: 12px;
    margin-bottom: 24px;
  }
  .tab-btn {
    flex: 1; padding: 10px 14px;
    background: transparent; border: none; color: #a1a1aa;
    font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 9px; font-family: inherit;
    transition: all .2s ease;
  }
  .tab-btn:hover { color: #d4d4d8; }
  .tab-btn.active {
    background: linear-gradient(135deg, #6366f1, #818cf8);
    color: #fff;
    box-shadow: 0 4px 16px rgba(99,102,241,.35);
  }
  .form { display: none; flex-direction: column; gap: 16px; }
  .form.active { display: flex; }
  .field label {
    display: block; font-size: 11px; color: #71717a;
    text-transform: uppercase; letter-spacing: 0.06em;
    font-weight: 700; margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    padding: 13px 16px;
    background: rgba(9,9,11,.6);
    border: 1px solid rgba(63,63,70,.5);
    border-radius: 12px;
    color: #fafafa;
    font-size: 14px;
    font-family: inherit;
    transition: all .2s ease;
  }
  .field input::placeholder { color: #52525b; }
  .field input:focus {
    outline: none;
    border-color: #818cf8;
    background: rgba(9,9,11,.85);
    box-shadow: 0 0 0 4px rgba(129,140,248,.15);
  }
  .btn-primary {
    margin-top: 6px;
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #6366f1, #818cf8);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 6px 24px rgba(99,102,241,.35);
    transition: all .2s ease;
    letter-spacing: -0.005em;
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 30px rgba(99,102,241,.5);
    background: linear-gradient(135deg, #4f46e5, #6366f1);
  }
  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .msg {
    font-size: 12px; padding: 11px 14px;
    border-radius: 10px; margin-top: 4px; display: none;
    font-weight: 500; line-height: 1.4;
  }
  .msg.error { display: block; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
  .msg.success { display: block; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: #86efac; }
  .footer-note {
    margin-top: 26px; font-size: 11px;
    color: #52525b; text-align: center;
    padding-top: 20px;
    border-top: 1px solid rgba(63,63,70,.3);
  }
  .features {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; margin-top: 18px; margin-bottom: -4px;
  }
  .feature {
    text-align: center;
    padding: 10px 6px;
    background: rgba(9,9,11,.4);
    border: 1px solid rgba(63,63,70,.3);
    border-radius: 10px;
  }
  .feature-num {
    font-size: 16px; font-weight: 800;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }
  .feature-label { font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-row">
      <div class="brand-icon">⚡</div>
      <div class="brand">Job Hunt Pro</div>
    </div>
    <div class="sub">Track applications. Prep interviews. Plan your move to Europe.</div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Sign in</button>
      <button class="tab-btn" data-tab="signup">Create account</button>
    </div>

    <form class="form active" id="form-login" autocomplete="on">
      <div class="field"><label>Email</label><input type="email" id="login-email" autocomplete="email" required></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" autocomplete="current-password" required></div>
      <button class="btn-primary" type="submit" id="login-submit">Sign in</button>
      <div class="msg" id="login-msg"></div>
    </form>

    <form class="form" id="form-signup" autocomplete="on">
      <div class="field"><label>Name</label><input type="text" id="signup-name" autocomplete="name"></div>
      <div class="field"><label>Email</label><input type="email" id="signup-email" autocomplete="email" required></div>
      <div class="field"><label>Password (6+ chars)</label><input type="password" id="signup-password" autocomplete="new-password" required minlength="6"></div>
      <button class="btn-primary" type="submit" id="signup-submit">Create account</button>
      <div class="msg" id="signup-msg"></div>
    </form>

    <div class="features">
      <div class="feature"><div class="feature-num">5+</div><div class="feature-label">Sources</div></div>
      <div class="feature"><div class="feature-num">AI</div><div class="feature-label">Coach</div></div>
      <div class="feature"><div class="feature-num">🇪🇺</div><div class="feature-label">EU Plan</div></div>
    </div>
    <div class="footer-note">Your data stays on your account. No spam, no resale.</div>
  </div>

<script>
  function showMsg(id, text, kind) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + (kind || 'error');
  }

  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.form').forEach(function(f){ f.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('form-' + btn.dataset.tab).classList.add('active');
    });
  });

  async function postJSON(url, body) {
    var r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body)
    });
    var data = {};
    try { data = await r.json(); } catch (_) {}
    return { ok: r.ok, status: r.status, data: data };
  }

  document.getElementById('form-login').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('login-submit');
    btn.disabled = true; btn.textContent = 'Signing in...';
    var res = await postJSON('/api/auth/login', {
      email: document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    });
    btn.disabled = false; btn.textContent = 'Sign in';
    if (res.ok) {
      showMsg('login-msg', 'Welcome back!', 'success');
      window.location.href = '/dashboard';
    } else {
      showMsg('login-msg', (res.data && res.data.error) || 'Sign-in failed', 'error');
    }
  });

  document.getElementById('form-signup').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('signup-submit');
    btn.disabled = true; btn.textContent = 'Creating account...';
    var res = await postJSON('/api/auth/signup', {
      name: document.getElementById('signup-name').value,
      email: document.getElementById('signup-email').value,
      password: document.getElementById('signup-password').value
    });
    btn.disabled = false; btn.textContent = 'Create account';
    if (res.ok) {
      showMsg('signup-msg', 'Account created — redirecting...', 'success');
      setTimeout(function(){ window.location.href = '/dashboard'; }, 600);
    } else {
      showMsg('signup-msg', (res.data && res.data.error) || 'Sign-up failed', 'error');
    }
  });
</script>
</body>
</html>
